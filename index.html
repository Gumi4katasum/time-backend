<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Управление на персонала</title>
<style>
:root{--bg:#f3f4f8;--card:#fff;--tx:#1b1f2a;--mu:#6c7488;--ac:#4f46e5;--bd:#e3e6ee;--ok:#16a34a;--no:#dc2626;--wa:#d97706}
@media(prefers-color-scheme:dark){:root{--bg:#0f1218;--card:#181c25;--tx:#e9ecf3;--mu:#98a0b3;--ac:#8b85ff;--bd:#272c38}}
*{box-sizing:border-box}body{margin:0;font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:5;padding:10px 12px 8px}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:8px;font-size:17px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--ac),#a99bff);color:#fff;display:grid;place-items:center;font-weight:800;font-size:18px;overflow:hidden}
nav{display:flex;gap:6px;overflow-x:auto}
main{padding:12px;max-width:1100px;margin:auto}
button,input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
button{cursor:pointer;white-space:nowrap}nav button{border-radius:20px;border-color:transparent;background:transparent;color:var(--mu);font-weight:600}
nav button.on{background:var(--ac);color:#fff}button.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,24,40,.06)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}
th,td{border-bottom:1px solid var(--bd);padding:5px;text-align:center;white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:13px}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--card);z-index:1}
td.c button{width:46px;height:40px;padding:0;font-weight:700;color:var(--mu);border-radius:10px}
td.nm{cursor:pointer;font-weight:600}th.dh{cursor:pointer}
.bb{font-weight:600;border-left:6px solid var(--bd)}.bb.sel{outline:2px solid var(--ac);outline-offset:1px}
.mu{color:var(--mu)}.b{display:inline-block;padding:3px 8px;border-radius:6px;color:#fff;font-size:12px;font-weight:700}
.in{background:var(--ok)}.out{background:var(--no)}.br{background:var(--wa)}.err{color:var(--no)}
td input{width:100%;min-width:90px}
td.c button{width:56px;padding:0 2px;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.adv-row td { text-align: left; }
.adv-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.adv-chip { background: var(--bg); border: 1px solid var(--bd); padding: 2px 6px; border-radius: 6px; font-size: 12px; display: flex; align-items: center; gap: 4px; }
.adv-chip button { padding: 0 4px; border: none; background: transparent; color: var(--no); font-weight: bold; cursor: pointer; font-size: 14px;}
</style>
</head>
<body>
<header><div class="brand"><span class="logo" id="logo"></span><b id="bn"></b></div><nav id="tabs"></nav></header>
<main id="app"></main>
<script>
const h = (t, a = {}, ...c) => {
  const e = document.createElement(t);
  for (const k in a) (k.startsWith('on') || k in e) ? e[k] = a[k] : e.setAttribute(k, a[k]);
  e.append(...c.flat().filter(x => x != null).map(x => x instanceof Node ? x : document.createTextNode(x)));
  return e;
};
const api = async (url, o = {}) => {
  const r = await fetch(url, { headers: { 'Content-Type': 'application/json' }, ...o, body: o.body ? JSON.stringify(o.body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || 'Грешка');
  return d;
};
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const addDays = (s, n) => { const d = new Date(s + 'T12:00'); d.setDate(d.getDate() + n); return iso(d); };
const monday = d => { d = new Date(d); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };

const depsOf = o => String(o.department || '').split(',').map(x => x.trim()).filter(Boolean);
const S = { dept: '', brush: 'Д', tab: 'sched', selectedDate: iso(new Date()), viewMode: 7, month: iso(new Date()).slice(0, 7), source: 'scans', pay: null, advDaySel: iso(new Date()) };
const TABS = { sched: 'График', shifts: 'Смени', pay: 'Заплати', adv: 'Аванси', live: 'На живо', emps: 'Служители' };
const COMPANY = 'ФЕРБИНДУНГ ГРУП ЕООД';   
const LOGO = '';                 
document.title = COMPANY;
document.getElementById('bn').textContent = COMPANY;
document.getElementById('logo').append(LOGO ? h('img', { src: LOGO, style: 'width:100%;height:100%;object-fit:cover' }) : COMPANY[0]);

async function render() {
  const tabs = document.getElementById('tabs'); tabs.innerHTML = '';
  for (const k in TABS) tabs.append(h('button', { className: S.tab === k ? 'on' : '', onclick: () => { S.tab = k; render(); } }, TABS[k]));
  const app = document.getElementById('app');
  try { const v = await ({ sched: vSched, shifts: vShifts, pay: vPay, adv: vAdv, live: vLive, emps: vEmps })[S.tab](); app.innerHTML = ''; app.append(v); }
  catch (e) { app.innerHTML = ''; app.append(h('p', { className: 'err' }, e.message)); }
}

// ---------- График ----------
async function vSched() {
  let startDay = S.selectedDate;
  if (S.viewMode === 7) {
    startDay = monday(S.selectedDate);
  }
  
  const days = [...Array(S.viewMode)].map((_, i) => addDays(startDay, i));
  const endDay = days[days.length - 1];
  const nm = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Нд'];

  const [all, sh] = await Promise.all([api('/api/workers'), api(`/api/shifts?from=${startDay}&to=${endDay}`)]);
  const ws = all.filter(w => !S.dept || depsOf(w).includes(S.dept));
  const P = sh.presets, map = {}, dmap = {};
  const vis = k => !S.dept || !P[k].department || P[k].department === S.dept;
  const colorOf = k => P[k]?.color || '#4f46e5';
  const order = ['', ...Object.keys(P).filter(vis)];
  
  if (S.brush !== 'cycle' && S.brush !== 'clear' && !(P[S.brush] && vis(S.brush))) S.brush = 'cycle';
  
  sh.rows.forEach(r => { map[r.worker_id + '|' + r.day] = r.label; dmap[r.worker_id + '|' + r.day] = r.department || ''; });
  const effDep = (w, k) => dmap[k] || (depsOf(w).length === 1 ? depsOf(w)[0] : '');
  const depFor = w => S.dept || (depsOf(w).length > 1 ? undefined : (depsOf(w)[0] || ''));
  const cells = [], hrs = {}, cnt = [];
  
  const sums = w => { const o = {}; days.forEach(d => { const k = w.id + '|' + d, v = map[k]; if (v) { const dp = effDep(w, k); o[dp] = (o[dp] || 0) + (P[v]?.h || 0); } }); return o; };
  const upd = () => {
    cells.forEach(([b, k, w]) => {
      const v = map[k], dp = effDep(w, k), other = S.dept && v && dp && dp !== S.dept;
      b.textContent = v || '·'; b.title = v ? v + (dp ? ' · ' + dp : '') : '';
      b.style.background = v ? colorOf(v) : ''; b.style.color = v ? '#fff' : ''; b.style.borderColor = v ? colorOf(v) : ''; b.style.opacity = other ? '.4' : '';
    });
    ws.forEach(w => {
      const o = sums(w), ent = Object.entries(o), tot = ent.reduce((a, [, x]) => a + x, 0);
      hrs[w.id].textContent = S.dept ? String(o[S.dept] || 0) : (ent.length > 1 ? tot + '  (' + ent.map(([d, x]) => (d || '—') + ' ' + x).join(' · ') + ')' : String(tot));
    });
    days.forEach((d, i) => cnt[i].textContent = ws.filter(w => { const k = w.id + '|' + d; return map[k] && (!S.dept || !effDep(w, k) || effDep(w, k) === S.dept); }).length);
  };
  
  const target = () => S.brush === 'cycle' ? null : S.brush === 'clear' ? '' : S.brush;
  const apply = async (pairs, v) => {
    const deps = pairs.map(([w]) => v ? depFor(w) : '');
    if (deps.includes(undefined)) { alert('Този човек е в няколко отдела. Избери отдела от бутоните най-горе.'); return; }
    const old = pairs.map(([w, d]) => [map[w.id + '|' + d] || '', dmap[w.id + '|' + d] || '']);
    pairs.forEach(([w, d], i) => { map[w.id + '|' + d] = v; dmap[w.id + '|' + d] = deps[i] || ''; }); upd();
    try { await api('/api/shifts/bulk', { method: 'PUT', body: { items: pairs.map(([w, d], i) => ({ worker_id: w.id, day: d, label: v, department: deps[i] })) } }); }
    catch (e) { pairs.forEach(([w, d], i) => { map[w.id + '|' + d] = old[i][0]; dmap[w.id + '|' + d] = old[i][1]; }); upd(); alert(e.message); }
  };
  const fill = pairs => { const v = target(); if (v === null) { alert('Избери смяна от лентата най-горе.'); return; } apply(pairs, v); };
  
  const bar = h('div', { className: 'row' });
  ['cycle', ...Object.keys(P).filter(vis), 'clear'].forEach(k => {
    const btn = h('button', { className: 'bb' + (S.brush === k ? ' sel' : ''), onclick: () => { S.brush = k; [...bar.children].forEach(c => c.classList.toggle('sel', c.dataset.k === k)); } },
      k === 'cycle' ? '↻ Редуване' : k === 'clear' ? '✕ Изтрий' : k + ' ' + P[k].t);
    btn.dataset.k = k; if (P[k]) btn.style.borderLeftColor = colorOf(k); bar.append(btn);
  });
  bar.append(h('button', { onclick: () => { S.tab = 'shifts'; render(); } }, '＋ Нова смяна'));

  const table = h('table', {}, h('tr', {}, h('th', {}, 'Служител'),
    days.map((d, i) => {
      const dayName = S.viewMode === 1 ? ['Нд', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'][new Date(d + 'T12:00:00').getDay()] : nm[(new Date(d + 'T12:00:00').getDay() + 6) % 7];
      return h('th', { className: 'dh', onclick: () => { if (ws.length && confirm('Попълни ' + dayName + ' ' + d.slice(8) + '.' + d.slice(5, 7) + ' за всички служители?')) fill(ws.map(w => [w, d])); } }, 
        dayName, h('br'), h('span', {}, d.slice(8) + '.' + d.slice(5, 7)))
    }), 
    h('th', {}, S.dept ? 'Часове · ' + S.dept : 'Часове')));

  ws.forEach(w => {
    hrs[w.id] = h('b');
    table.append(h('tr', {}, h('td', { className: 'nm', onclick: () => fill(days.map(d => [w, d])) }, w.name), days.map(d => {
      const k = w.id + '|' + d, b = h('button', {});
      b.onclick = () => {
        const old = map[k] || '';
        const nx = S.brush === 'cycle' ? order[(order.indexOf(old) + 1) % order.length] : S.brush === 'clear' ? '' : ((old === S.brush && (!S.dept || effDep(w, k) === S.dept)) ? '' : S.brush);
        apply([[w, d]], nx);
      };
      cells.push([b, k, w]); return h('td', { className: 'c' }, b);
    }), h('td', {}, hrs[w.id])));
  });
  table.append(h('tr', {}, h('td', {}, 'Хора на смяна'), days.map((_, i) => { cnt[i] = h('b'); return h('td', {}, cnt[i]); }), h('td')));
  upd();

  const viewToggle = h('div', { className: 'row', style: 'gap:4px; margin:0;' },
    h('button', { className: S.viewMode === 1 ? 'p' : '', onclick: () => { S.viewMode = 1; render(); } }, 'Ден'),
    h('button', { className: S.viewMode === 3 ? 'p' : '', onclick: () => { S.viewMode = 3; render(); } }, '3 Дни'),
    h('button', { className: S.viewMode === 7 ? 'p' : '', onclick: () => { S.viewMode = 7; render(); } }, 'Седмица')
  );

  const navRow = h('div', { className: 'row' },
    viewToggle,
    h('div', { style: 'width: 1px; height: 24px; background: var(--bd); margin: 0 10px;' }),
    h('button', { onclick: () => { S.selectedDate = addDays(S.selectedDate, -S.viewMode); render(); } }, '◀'),
    h('input', { 
      type: 'date', 
      value: S.selectedDate, 
      style: 'width: auto;', 
      onchange: e => { S.selectedDate = e.target.value; render(); } 
    }),
    h('button', { onclick: () => { S.selectedDate = addDays(S.selectedDate, S.viewMode); render(); } }, '▶'),
    h('button', { onclick: () => { S.selectedDate = iso(new Date()); render(); } }, 'Днес'),
    h('button', { onclick: async () => {
      if (!confirm(`Копиране на предходните ${S.viewMode} дни в тези?`)) return;
      try { 
        const from = addDays(startDay, -S.viewMode);
        const to = startDay;
        await api('/api/shifts/copy-week', { method: 'POST', body: { from_monday: from, to_monday: to } }); 
        render(); 
      } catch (e) { alert(e.message); }
    } }, 'Копирай предишните дни'))
  );

  return h('div', { className: 'card' },
    navRow,
    deptBar(all),
    bar,
    h('p', { className: 'mu' }, 'Избери отдел, после смяна, и докосвай клетки.'),
    h('div', { className: 'scroll' }, table));
}

// ---------- Заплати ----------
async function vPay() {
  const all = await api('/api/workers');
  const [y, m] = S.month.split('-').map(Number), last = new Date(y, m, 0).getDate();
  const body = () => ({ start_date: S.month + '-01', end_date: S.month + '-' + String(last).padStart(2, '0'), advance_until: S.advDaySel, source: S.source });
  const out = h('div', { className: 'scroll' });
  
  const show = () => {
    if (!S.pay) return;
    const rowsF = S.pay.map(r => ({ ...r, parts: (r.parts || []).filter(p => !S.dept || p.department === S.dept) })).filter(r => r.parts.length);
    
    const t = h('table', {}, h('tr', {}, ['Служител', 'Отдел', 'Часове', 'Ставка €', 'Общо €', 'Аванс по часове €', 'Ръчен аванс €', 'Заплата €'].map(x => h('th', {}, x))));
    const T = [0, 0, 0, 0], f2 = n => n.toFixed(2);
    
    rowsF.forEach(r => {
      const manualAdv = r.manual_advance || 0;
      
      r.parts.forEach((p, i) => t.append(h('tr', {}, 
        h('td', {}, i === 0 ? r.name : ''), 
        h('td', {}, p.department || '—'), 
        h('td', {}, p.hours), 
        h('td', {}, f2(p.rate)), 
        h('td', {}, f2(p.amount)), 
        h('td', {}, f2(p.advance)), 
        h('td', {}, i === 0 ? h('b', {}, f2(manualAdv)) : ''), 
        h('td', {}, f2(p.salary))
      )));
      
      const sm = k => r.parts.reduce((a, p) => a + p[k], 0);
      T[0] += sm('amount'); T[1] += sm('advance'); T[2] += manualAdv; T[3] += sm('salary');
      
      if (r.parts.length > 1) t.append(h('tr', {}, 
        h('td', {}, h('b', {}, 'Общо ' + r.name)), 
        h('td'), 
        h('td', {}, h('b', {}, +sm('hours').toFixed(2))), 
        h('td'), 
        h('td', {}, h('b', {}, f2(sm('amount')))), 
        h('td', {}, h('b', {}, f2(sm('advance')))), 
        h('td', {}, h('b', {}, f2(manualAdv))),
        h('td', {}, h('b', {}, f2(sm('salary'))))
      ));
    });
    t.append(h('tr', {}, 
      h('td', {}, h('b', {}, 'Всичко')), h('td'), h('td'), h('td'), 
      h('td', {}, f2(T[0])), h('td', {}, f2(T[1])), h('td', {}, f2(T[2])), h('td', {}, h('b', {}, f2(T[3])))
    ));
    out.innerHTML = ''; out.append(t);
  };
  show();
  
  return h('div', { className: 'card' },
    deptBar(all),
    h('div', { className: 'row' },
      h('label', {}, 'Аванс до ден ', h('input', { type: 'date', value: S.advDaySel, onchange: e => { S.advDaySel = e.target.value; S.pay = null; render(); } })),
      h('input', { type: 'month', value: S.month, onchange: e => { S.month = e.target.value; S.pay = null; render(); } }),
      h('select', { onchange: e => { S.source = e.target.value; S.pay = null; } },
        h('option', { value: 'scans', selected: S.source === 'scans' }, 'Часове от сканиранията'),
        h('option', { value: 'schedule', selected: S.source === 'schedule' }, 'Часове от графика')),
      h('button', { className: 'p', onclick: async () => { try { S.pay = (await api('/api/payroll/calculate', { method: 'POST', body: body() })).rows; show(); } catch (e) { alert(e.message); } } }, 'Изчисли')),
    h('p', { className: 'mu' }, 'Аванс по часове = часовете от 1-во число до избраната дата. Ръчен аванс = въведените суми от таб „Аванси“. Заплата = общо за месеца − (аванс по часове + ръчен аванс).'),
    out);
}

// ---------- Аванси ----------
async function vAdv() {
  const all = await api('/api/workers');
  const [y, m] = S.month.split('-').map(Number), last = new Date(y, m, 0).getDate();
  const from = S.month + '-01', to = S.month + '-' + String(last).padStart(2, '0');
  const [sum, list] = await Promise.all([
    api(`/api/advances/summary?month=${S.month}&advance_until=${S.advDaySel || to}`),
    api(`/api/advances?from=${from}&to=${to}`)
  ]);
  const byWorker = {};
  list.forEach(x => (byWorker[x.worker_id] ||= []).push(x));

  const fw = h('select', {}, h('option', { value: '' }, 'Избери служител…'), all.map(w => h('option', { value: w.id }, w.name)));
  const fday = h('input', { type: 'date', value: S.advDaySel || iso(new Date()) });
  const famt = h('input', { type: 'number', step: '0.01', placeholder: 'Сума €', style: 'width:110px' });
  const fnote = h('input', { placeholder: 'Бележка (по желание)' });

  const t = h('table', {}, h('tr', {}, ['Служител', 'Ръчно дадено €', 'Записи', ''].map(x => h('th', {}, x))));
  sum.forEach(w => {
    const recs = (byWorker[w.id] || []).map(r =>
      h('span', { className: 'adv-chip' },
        r.day.slice(8) + '.' + r.day.slice(5, 7) + ' — ' + Number(r.amount).toFixed(2) + ' €' + (r.note ? ' (' + r.note + ')' : ''),
        h('button', { onclick: async () => {
          if (!confirm('Изтриване на аванс?')) return;
          try { await api('/api/advances/' + r.id, { method: 'DELETE' }); render(); } catch (e) { alert(e.message); }
        } }, '✕')));
    t.append(h('tr', { className: 'adv-row' },
      h('td', {}, w.name),
      h('td', { style: 'text-align:center' }, h('b', {}, Number(w.manual_advance).toFixed(2))),
      h('td', {}, h('div', { className: 'adv-chips' }, ...(recs.length ? recs : [h('span', { className: 'mu' }, 'Няма')]))),
      h('td')));
  });

  return h('div', { className: 'card' },
    deptBar(all),
    h('div', { className: 'row' },
      h('label', {}, 'Аванс до ден ',
        h('input', { type: 'date', value: S.advDaySel || iso(new Date()), onchange: e => { S.advDaySel = e.target.value; render(); } })),
      h('input', { type: 'month', value: S.month, onchange: e => { S.month = e.target.value; render(); } })),
    h('b', {}, 'Нов аванс'),
    h('div', { className: 'row' }, fw, fday, famt, fnote,
      h('button', { className: 'p', onclick: async () => {
        if (!fw.value || !fday.value || !(Number(famt.value) > 0)) return alert('Попълни служител, дата и сума');
        try {
          await api('/api/advances', { method: 'POST', body: { worker_id: fw.value, day: fday.value, amount: famt.value, note: fnote.value } });
          render();
        } catch (e) { alert(e.message); }
      } }, 'Добави')),
    h('p', { className: 'mu' }, 'Тук въвеждаш ръчно дадените аванси. Те се приспадат автоматично в „Заплати“ заедно с изчисления по часове аванс.'),
    h('div', { className: 'scroll' }, t));
}

// ---------- На живо ----------
async function vLive() {
  const d = await api('/api/status/live');
  const t = h('table', {}, h('tr', {}, h('th', {}, 'Служител'), h('th', {}, 'Статус'), h('th', {}, 'От')));
  if (!d.length) t.append(h('tr', {}, h('td', { colSpan: 3 }, 'Няма сканирания днес.')));
  d.forEach(e => {
    const s = e.code === 'clock_out' ? ['Излязъл', 'out'] : e.code === 'break_start' ? ['В почивка', 'br'] : ['На работа', 'in'];
    t.append(h('tr', {}, h('td', {}, e.name), h('td', {}, h('span', { className: 'b ' + s[1] }, s[0])), h('td', {}, new Date(e.timestamp).toLocaleTimeString('bg-BG', { hour: '2-digit', minute: '2-digit' }))));
  });
  return h('div', { className: 'card' }, h('div', { className: 'scroll' }, t));
}

// ---------- Отдели ----------
const DEPTS = ['Сервитьори', 'Бармани', 'Готвачи', 'Хотел'];
const depList = ws => [...new Set([...DEPTS, ...ws.flatMap(depsOf)])];
function deptBar(ws) {
  const deps = [...new Set(ws.flatMap(depsOf))];
  if (!deps.length) return h('span');
  return h('div', { className: 'row' }, ['', ...deps].map(d => h('button', { className: S.dept === d ? 'p' : '', onclick: () => { S.dept = d; render(); } }, d || 'Всички')));
}

// ---------- Служители ----------
const mkRates = (depInput, init) => { 
  const vals = { ...init }, box = h('div', { style: 'display:flex;gap:6px;flex-wrap:wrap' });
  const build = () => {
    box.innerHTML = '';
    depsOf({ department: depInput.value }).forEach(d => box.append(h('label', { style: 'display:flex;gap:4px;align-items:center' }, d,
      h('input', { type: 'number', step: '0.01', placeholder: '€/час', value: vals[d] ?? '', style: 'width:80px;min-width:0', oninput: e => { vals[d] = e.target.value; } }))));
    if (!box.children.length) box.append(h('span', { className: 'mu' }, 'Въведи отдел'));
  };
  depInput.addEventListener('input', build); build();
  return { el: box, get: () => vals };
};

async function vEmps() {
  const ws = await api('/api/workers');
  const dl = h('datalist', { id: 'deps' }, depList(ws).map(d => h('option', { value: d })));
  const depIn = v => { const i = h('input', { value: v || '', placeholder: 'Отдел(и), със запетая' }); i.setAttribute('list', 'deps'); return i; };
  const f = { name: h('input', { placeholder: 'Име' }), dep: depIn(''), sal: h('input', { type: 'number', placeholder: 'Месечна заплата €' }), card: h('input', { placeholder: 'Карта' }), bio: h('input', { placeholder: 'Биометрично ID' }) };
  const fr = mkRates(f.dep, {});
  const t = h('table', {}, h('tr', {}, ['Име', 'Отдел', 'Ставка на час по отдели', 'Месечна заплата €', 'Карта', 'Биометрично ID', '', ''].map(x => h('th', {}, x))));
  ws.forEach(w => {
    const i = { n: h('input', { value: w.name }), d: depIn(w.department), s: h('input', { type: 'number', value: w.monthly_salary }), c: h('input', { value: w.card_token || '' }), b: h('input', { value: w.biometric_id || '' }) };
    const rr = mkRates(i.d, w.rates || {});
    t.append(h('tr', {}, h('td', {}, i.n), h('td', {}, i.d), h('td', {}, rr.el), h('td', {}, i.s), h('td', {}, i.c), h('td', {}, i.b),
      h('td', {}, h('button', { onclick: async () => { try { await api('/api/workers/' + w.id, { method: 'PUT', body: { name: i.n.value, department: i.d.value, monthly_salary: i.s.value, card_token: i.c.value, biometric_id: i.b.value, rates: rr.get() } }); alert('Запазено'); } catch (e) { alert(e.message); } } }, 'Запази')),
      h('td', {}, h('button', { onclick: async () => { if (confirm('Скриване на ' + w.name + '?')) { await api('/api/workers/' + w.id, { method: 'DELETE' }); render(); } } }, '✕'))));
  });
  return h('div', {}, dl,
    h('p', { className: 'mu' }, 'Ако за отдел няма въведена ставка, часът се плаща по месечната заплата ÷ 168.'),
    h('p', { className: 'mu' }, 'Страница за служителите (изпрати им този адрес): ', h('b', {}, location.origin + '/schedule')),
    h('div', { className: 'card' }, h('div', { className: 'row' }, f.name, f.dep, fr.el, f.sal, f.card, f.bio,
      h('button', { className: 'p', onclick: async () => { try { await api('/api/workers', { method: 'POST', body: { name: f.name.value, department: f.dep.value, monthly_salary: f.sal.value, card_token: f.card.value, biometric_id: f.bio.value, rates: fr.get() } }); render(); } catch (e) { alert(e.message); } } }, 'Добави'))),
    h('div', { className: 'card scroll' }, t));
}

// ---------- Смени ----------
async function vShifts() {
  const [T, ws] = await Promise.all([api('/api/shift-types'), api('/api/workers')]);
  const deps = depList(ws);
  const depSel = v => h('select', {}, h('option', { value: '' }, 'За всички отдели'), deps.map(d => h('option', { value: d, selected: d === v }, d)));
  const mk = x => ({ code: x.code ? x.code.value : undefined, start_time: x.st.value, end_time: x.en.value, color: x.col.value, department: x.dep.value });
  const f = { code: h('input', { placeholder: 'Име на смяната', maxLength: 20, style: 'width:160px' }), st: h('input', { type: 'time', value: '08:00' }), en: h('input', { type: 'time', value: '16:00' }), col: h('input', { type: 'color', value: '#f59e0b', style: 'width:54px;padding:2px' }), dep: depSel('') };
  const t = h('table', {}, h('tr', {}, ['Смяна', 'Начало', 'Край', 'Часове', 'Цвят', 'Отдел', '', ''].map(x => h('th', {}, x))));
  Object.entries(T).forEach(([code, v]) => {
    const x = { st: h('input', { type: 'time', value: v.start_time }), en: h('input', { type: 'time', value: v.end_time }), col: h('input', { type: 'color', value: v.color, style: 'width:54px;padding:2px' }), dep: depSel(v.department || '') };
    t.append(h('tr', {}, h('td', {}, h('span', { className: 'b', style: 'background:' + v.color }, code)), h('td', {}, x.st), h('td', {}, x.en), h('td', {}, v.h), h('td', {}, x.col), h('td', {}, x.dep),
      h('td', {}, h('button', { onclick: async () => { try { await api('/api/shift-types/' + encodeURIComponent(code), { method: 'PUT', body: mk(x) }); render(); } catch (e) { alert(e.message); } } }, 'Запази')),
      h('td', {}, h('button', { onclick: async () => { if (confirm('Изтриване на смяна ' + code + '?')) { try { await api('/api/shift-types/' + encodeURIComponent(code), { method: 'DELETE' }); render(); } catch (e) { alert(e.message); } } } }, '✕'))));
  });
  return h('div', {},
    h('div', { className: 'card' }, h('b', {}, 'Нова смяна'), h('p', { className: 'mu' }, 'Името се вижда в графика (в клетката се показват първите знаци), например „Бар сутрин“. Часовете се смятат сами; ако краят е по-рано от началото, смяната минава през полунощ.'),
      h('div', { className: 'row' }, f.code, f.st, '–', f.en, f.col, f.dep,
        h('button', { className: 'p', onclick: async () => { try { await api('/api/shift-types', { method: 'POST', body: mk(f) }); render(); } catch (e) { alert(e.message); } } }, 'Добави'))),
    h('div', { className: 'card scroll' }, t, h('p', { className: 'mu' }, 'Промяната на часовете важи за новите смени. Вече сложените в графика запазват часовете си.')));
}

render();
</script>
</body>
</html>
